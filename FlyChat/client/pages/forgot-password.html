<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | FlyChat</title>

    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>FlyChat</h1>

            <p class="subtitle">
                Connect. Chat. Share. AI.
            </p>

            <h2>Forgot Password</h2>

            <p class="subtitle">
                Enter your registered email address.
            </p>

            <form id="forgotForm">

                <div class="input-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <button type="submit">
                    Send Reset Link
                </button>

            </form>

            <p class="account-text">
                Remember your password?
                <a href="login.html">Back to Login</a>
            </p>

            <p id="message"></p>

        </div>

    </div>

    <script src="../js/forgot-password.js"></script>

</body>
</html>
