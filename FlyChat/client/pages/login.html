<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | FlyChat</title>

    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>FlyChat</h1>

            <p class="subtitle">
                Connect. Chat. Share. AI.
            </p>

            <h2>Welcome Back</h2>

            <form id="loginForm">

                <div class="input-group">
                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <p class="forgot-link">
                    <a href="forgot-password.html">
                        Forgot Password?
                    </a>
                </p>

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="account-text">
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>

            <p id="message"></p>

        </div>

    </div>

    <script src="../js/login.js"></script>

</body>
</html>
