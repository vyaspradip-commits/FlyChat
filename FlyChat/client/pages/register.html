<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | FlyChat</title>

    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>FlyChat</h1>

            <p class="subtitle">
                Connect. Chat. Share. AI.
            </p>

            <h2>Create Account</h2>

            <form id="registerForm">

                <div class="input-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="input-group">

                    <label>Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button type="submit">
                    Create Account
                </button>

            </form>


            <p class="account-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>


            <p id="message"></p>

        </div>

    </div>


    <script src="../js/register.js"></script>

</body>

</html>
