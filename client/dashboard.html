<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>FlyChat</title>
        <link rel="stylesheet" href="css/style.css">
        <link rel="stylesheet" href="css/whatsapp.css">
    </head>
    <body onload="checkLogin()">
        <div class="app">
            <div class="sidebar">
                <img class="sidebar-profile user-dp" 
                src="images/user.png"
                alt="Profile">
                <button
                    onclick="window.location.href='create-group.html'"
                    title="Create Group">
                    👥
                </button>
                <button onclick="window.location.href='profile.html'" title="Profile">
                    👤
                </button>
                <button onclick="window.location.href='settings.html'" title="Settings">
                    ⚙
                </button>
                <button onclick="logout()">🚪</button>
            </div>
            <div class="chat-list">
                <div class="chat-top">
                    <h2>Chats</h2>
                    <input 
                    id="searchUser"
                    class="search"
                    type="text"
                    placeholder="Search Chats...">
                </div>
                <div id="chatContainer">
                    <p 
                        id="noResult" 
                        style="
                            display:none;
                            text-align:center;
                            padding:20px;
                            color:gray;
                        ">
                        No chats found
                    </p>
                </div>
            </div>
            <div class="chat-window">
                <div id="chatArea">
                    <div class="welcome-screen">
                        <h1>💬 FlyChat</h1>
                        <p>
                            Select a chat to start messaging.
                        </p>
                    </div>
                </div>    
            </div>
        </div>
        <script src="js/utils.js"></script>
        <script src="js/auth.js"></script>
        <script src="js/dashboard.js"></script>
        <script src="js/privateChat.js"></script>
        <script src="js/groupChat.js"></script>
        <script src="js/fileShare.js"></script>
        <script src="js/search.js"></script>
        <script src="js/emoji.js"></script>
        <script src="js/app.js"></script>
    </body>  
</html>
