<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chat | FlyChat</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<div class="chat-container">


    <!-- Chat Header -->

    <div class="chat-header">

        <a href="dashboard.html">
            ←
        </a>


        <div>

            <h3 id="chatUser">
                💬 Chat
            </h3>


            <small>
                🟢 Online
            </small>

        </div>

    </div>



    <!-- Messages -->

    <div class="chat-box" id="messages">


        <div class="message received">

            <div>
                Hello 👋
            </div>

            <small class="message-time">
                07:30 PM | 11/07/2026
            </small>

        </div>



        <div class="message sent">

            <div>
                Hi, how are you?
            </div>

            <small class="message-time">
                07:45 PM | 11/07/2026
            </small>

        </div>



        <div class="message received">

            <div>
                I am good 😊
            </div>

            <small class="message-time">
                07:48 PM | 11/07/2026
            </small>

        </div>



        <div class="message sent">

            <div>
                Nice 👍
            </div>

            <small class="message-time">
                07:50 PM | 11/07/2026
            </small>

        </div>


    </div>




    <!-- Emoji Area -->

    <div id="emojiBox" class="emoji-box"></div>




    <!-- Input Area -->

    <div class="chat-input">


        <button 
            class="emoji-button" 
            id="emojiBtn">
            onclick="toggleEmojiPicker()">
            😊

        </button>



        <input 
            id="messageInput"
            type="text"
            placeholder="Type a message..."
        >



        <button onclick="sendMessage()">

            Send

        </button>


    </div>



</div>


<script src="js/utils.js"></script>
<script src="js/app.js"></script>


</body>

</html>
