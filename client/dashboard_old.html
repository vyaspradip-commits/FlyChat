<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard | FlyChat</title>

        <link rel="stylesheet" href="css/style.css">
    </head>

    <body>

        <div class="dashboard">
            <!-- Sidebar -->
            <div class="sidebar">

                <div class="logo">
                    FlyChat
                </div>

                <ul>
                    <li>
                        <a href="settings.html">🌙 Dark Mode</a>
                    </li>

                    <li>
                        <a href="profile.html">👤 Profile</a>
                    </li>

                    <li>
                        <a href="settings.html">⚙ Settings</a>
                    </li>

                    <li>
                        <a href="#" onclick="logout()">🚪 Logout</a>
                    </li>
                </ul>
            </div>
            <div class="main">
                <h1>Welcome to FlyChat</h1>
                <input 
                    class="search"
                    id="searchUser"
                    type="text"
                    placeholder="Search friends..."
                >
                <h2>Chats</h2>
                <div class="chat-list" id="chat-list">
                    <p id="noUser" style="display: none;">
                        No user found
                    </p>
                    <a href="chat.html?user=Vyas">
                        <div class="chat-item">
                            <img
                            class="avatar user-dp"
                            src="images/user.png"
                            alt="Vyas">
                            <div>
                                <h3>
                                    Vyas
                                </h3>
                                <p>
                                    Hello
                                </p>
                            </div>
                            <small>
                                10:49 PM
                            </small>
                        </div>
                    </a>
                    <a href="chat.html?user=Dasharath">
                        <div class="chat-item">
                            <img
                            class="avatar user-dp"
                            src="images/user.png"
                            alt="Dasharath">
                            <div>
                                <h3>
                                    Dasharath
                                </h3>
                                <p>
                                    Backend completed
                                </p>
                            </div>
                            <small>
                                9:45 PM
                            </small>
                        </div>
                    </a>   
                    <a href="chat.html?user=Vaidik">
                        <div class="chat-item">
                            <img
                            class="avatar user-dp"
                            src="images/user.png"
                            alt="Vaidik">
                            <div>
                                <h3>
                                    Vaidik
                                </h3>
                                <p>
                                    Let's test app
                                </p>
                            </div>
                            <small>
                                Yesterday
                            </small>
                        </div>
                    </a> 
                </div>
                <h2>
                    Groups
                </h2>
                <a href="group.html">
                    <div class="chat-item">
                        <div>
                            <h3>
                                👥 FlyChat Team
                            </h3>
                            <p>
                                3 Members
                            </p>
                        </div>
                    </div>
                </a>
            </div>    
        </div>
        <script src="js/app.js"></script>

    </body>
</html>
