<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Settings | FlyChat</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body class="settings-page" onload="checkLogin()">
        <div class="container">
            <h2>⚙️ Settings</h2>
            <div class="card settings-item">
                <span>🌙 Dark Mode</span>
                <button id="theme-toggle" onclick="toggleDarkMode()">
                    Toggle
                </button>
            </div>
            <div class="card settings-item">
                <span>🔔 Notifications</span>
                <button>ON/OFF</button>
            </div>
            <div class="card settings-item">
                <span>🔒 Privacy</span>
                <button onclick="window.location.href='privacy.html'">Manage</button>
            </div>
            <br>
            <button onclick="logout()">
                Logout
            </button>    
            <br><br>
            <a href="dashboard.html">
                <button>Back to Dashboard</button>
            </a>
        </div>
        <script src="js/utils.js"></script>
        <script src="js/app.js"></script>
        <script src="js/auth.js"></script>
    </body>
</html>
